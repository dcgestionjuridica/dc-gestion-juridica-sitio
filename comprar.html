<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Comprar DC Gestión Jurídica</title>
<link rel="icon" href="assets/favicon.png" onerror="this.remove()">
<style>
:root{--bg:#f4f6fa;--surf:#fff;--ink:#10223f;--mut:#5b6b85;--line:#dbe2ee;--azul:#2E6BE6;--oro:#D9AE4C;--navy:#0A1630;--ok:#1f9d63;--mal:#c2362f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1630;--surf:#12224a;--ink:#eef2fa;--mut:#9fb0cc;--line:#26396a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--navy);color:#fff;padding:16px max(16px,env(safe-area-inset-left,0px))}
header div{max-width:960px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:18px}header span{color:#BFC9E0;font-size:14px}
main{max-width:960px;margin:auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 64px}
h1{font-size:clamp(26px,4vw,36px);line-height:1.15;margin:0 0 6px}
h2{font-size:21px;margin:0 0 14px}
.sub{color:var(--mut);margin:0 0 24px}
.pasos{display:flex;gap:8px;margin:0 0 24px;flex-wrap:wrap}
.pasos span{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--surf);border:1px solid var(--line);color:var(--mut)}
.pasos span.on{background:var(--azul);border-color:var(--azul);color:#fff}
.pasos span.ya{color:var(--ok);border-color:var(--ok)}
.tarjeta{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:24px}
.modal{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px;background:var(--surf);margin-bottom:18px}
.modal button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:700;padding:8px 18px;border-radius:999px;cursor:pointer}
.modal button.on{background:var(--azul);color:#fff}
.planes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.plan{border:2px solid var(--line);border-radius:18px;padding:20px;background:var(--surf);cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:6px}
.plan.on{border-color:var(--azul);box-shadow:0 0 0 3px rgba(46,107,230,.18)}
.plan h3{margin:0;font-size:20px}.plan .pr{font-size:28px;font-weight:800}.plan small{color:var(--mut);font-size:14px;font-weight:500}
.plan ul{margin:6px 0 0;padding-left:18px;color:var(--mut);font-size:14.5px}
.campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.campos label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600}
.campos input{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.campos .ancho{grid-column:1/-1}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 24px;cursor:pointer;background:var(--azul);color:#fff}
.btn.oro{background:var(--oro);color:#2a1c00}.btn.gris{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fila{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap}
.pag{border:1px solid var(--line);border-radius:14px;padding:20px 22px;background:var(--bg);min-height:260px;max-height:56vh;overflow:auto}
.pag h4{margin:14px 0 4px;font-size:15px}.pag p{margin:0 0 10px;font-size:15px}.pag li{font-size:15px}
.cont{color:var(--mut);font-size:14px}
.acepto{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:15px}
.acepto input{width:22px;height:22px;margin-top:2px;flex:none}
.err{color:var(--mal);font-weight:600;margin-top:12px}
.resumen{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:18px}
a{color:var(--azul)}
.gran{text-align:center;padding:40px 16px}.gran .ic{font-size:48px}
@media(max-width:760px){.planes{grid-template-columns:1fr}.campos{grid-template-columns:1fr}}
</style></head><body>
<header><div><b>DC Gestión Jurídica</b><span>Compra segura en línea</span></div></header>
<main>
<h1>Compre su plan</h1>
<p class="sub">Elija el plan, lea el contrato y pague. Al confirmarse el pago, su cuenta se activa sola y le llega el acceso a su correo.</p>
<div class="pasos" id="pasos"><span>1. Plan</span><span>2. Sus datos</span><span>3. Contrato</span><span>4. Pago</span></div>
<section id="vista"><div class="tarjeta">Cargando planes…</div></section>
</main>
<script>
(function(){
var API='https://okvxxppudwbcldxpxyfw.supabase.co/functions/v1/compra-publica';
var S={paso:1,planes:[],docs:[],plan:null,modal:'Mensual',datos:{},bloques:[],pag:0,paginas:[],ultimaVista:0,monto:0,ocupado:false,err:''};
var $=function(i){return document.getElementById(i)};
var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var cop=function(n){return '$'+Math.round(Number(n)||0).toLocaleString('es-CO')};
function llamar(cuerpo){return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cuerpo)}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok||j.error){var e=new Error(j.error||'No se pudo completar. Intente de nuevo.');e.faltan=j.faltan;throw e}return j})})}
function pasos(){var n=['1. Plan','2. Sus datos','3. Contrato','4. Pago'];$('pasos').innerHTML=n.map(function(t,i){return '<span class="'+(S.paso===i+1?'on':S.paso>i+1?'ya':'')+'">'+t+'</span>'}).join('')}
function precio(p){return S.modal==='Anual'?p.precio_anual:p.precio_mensual}
function vPlan(){
 var h='<div class="tarjeta"><h2>Elija su plan</h2><div class="modal"><button type="button" data-m="Mensual" class="'+(S.modal==='Mensual'?'on':'')+'">Mensual</button><button type="button" data-m="Anual" class="'+(S.modal==='Anual'?'on':'')+'">Anual</button></div><div class="planes">';
 S.planes.forEach(function(p){h+='<button type="button" class="plan'+(S.plan&&S.plan.id===p.id?' on':'')+'" data-p="'+p.id+'"><h3>'+esc(p.nombre)+'</h3><div class="pr">'+cop(precio(p))+' <small>/ '+(S.modal==='Anual'?'año':'mes')+'</small></div><ul><li>'+p.usuarios_incluidos+' usuario'+(p.usuarios_incluidos>1?'s':'')+' incluido'+(p.usuarios_incluidos>1?'s':'')+'</li>'+(p.precio_usuario_adicional?'<li>Usuario adicional: '+cop(p.precio_usuario_adicional)+'</li>':'')+'</ul></button>'});
 h+='</div><div class="fila"><span class="cont">Los precios incluyen todo lo de la aplicación.</span><button class="btn" id="sig" '+(S.plan?'':'disabled')+'>Continuar</button></div></div>';
 $('vista').innerHTML=h;
 document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){S.modal=b.dataset.m;vPlan()}});
 document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){S.plan=S.planes.filter(function(p){return p.id==b.dataset.p})[0];vPlan()}});
 $('sig').onclick=function(){S.paso=2;S.err='';render()}
}
var CAMPOS=[['nombre_despacho','Nombre del despacho o del abogado',1],['documento_despacho','NIT o cédula',0],['ciudad','Ciudad',0],['titular_nombre','Nombre completo del titular',0],['cedula_titular','Cédula del titular',0],['correo','Correo del titular (allí llegará su acceso)',0],['telefono','Teléfono o WhatsApp (opcional)',0]];
function vDatos(){
 var h='<div class="tarjeta"><h2>Sus datos</h2><p class="cont">Con estos datos se llena su contrato. Revíselos bien.</p><div class="campos">';
 CAMPOS.forEach(function(c){h+='<label class="'+(c[2]?'ancho':'')+'">'+c[1]+'<input id="c_'+c[0]+'" value="'+esc(S.datos[c[0]]||'')+'" autocomplete="off"'+(c[0]==='correo'?' type="email"':'')+'></label>'});
 h+='</div><div class="err" id="err">'+esc(S.err)+'</div><div class="fila"><button class="btn gris" id="atr">Atrás</button><button class="btn" id="sig">Ver el contrato</button></div></div>';
 $('vista').innerHTML=h;
 $('atr').onclick=function(){S.paso=1;render()};
 $('sig').onclick=function(){
  CAMPOS.forEach(function(c){S.datos[c[0]]=$('c_'+c[0]).value.trim()});
  var falta=CAMPOS.filter(function(c){return c[0]!=='telefono'&&!S.datos[c[0]]});
  if(falta.length){S.err='Falta: '+falta.map(function(c){return c[1].split(' (')[0]}).join(', ')+'.';return vDatos()}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.datos.correo)){S.err='Escriba un correo válido.';return vDatos()}
  S.err='';$('sig').disabled=true;$('sig').textContent='Preparando…';
  llamar(Object.assign({operacion:'contrato',plan_id:S.plan.id,modalidad:S.modal},S.datos)).then(function(r){
   S.bloques=r.bloques;S.monto=r.monto;armarPaginas();S.pag=0;S.ultimaVista=0;S.acepto=false;S.paso=3;render()
  }).catch(function(e){S.err=e.message+(e.faltan&&e.faltan.length?' Falta: '+e.faltan.join(', ')+'.':'');vDatos()})
 }
}
function armarPaginas(){var P=[],a=[],n=0;S.bloques.forEach(function(b){var l=(b.x||'').length+60;if(n+l>1900&&a.length){P.push(a);a=[];n=0}a.push(b);n+=l});if(a.length)P.push(a);S.paginas=P}
function bloqueHtml(b){if(b.e==='t')return '<h3 style="margin:0 0 10px">'+esc(b.x)+'</h3>';if(b.e==='h')return '<h4>'+esc(b.x)+'</h4>';if(b.e==='l')return '<ul><li>'+esc(b.x)+'</li></ul>';return '<p>'+esc(b.x).replace(/\n/g,'<br>')+'</p>'}
function vContrato(){
 var tot=S.paginas.length,fin=S.ultimaVista>=tot-1;
 var h='<div class="tarjeta"><h2>Contrato</h2><div class="resumen"><span><b>'+esc(S.plan.nombre)+'</b> · '+S.modal+'</span><b>'+cop(S.monto)+'</b></div><div class="pag" id="pag">'+S.paginas[S.pag].map(bloqueHtml).join('')+'</div><div class="fila" style="margin-top:12px"><button class="btn gris" id="ant" '+(S.pag?'':'disabled')+'>Página anterior</button><span class="cont">Página '+(S.pag+1)+' de '+tot+'</span><button class="btn gris" id="sg" '+(S.pag<tot-1?'':'disabled')+'>Página siguiente</button></div>';
 if(fin){
  h+='<div class="cont" style="margin-top:16px">También puede leer los <a href="#" data-d="terminos">Términos y Condiciones</a> y la <a href="#" data-d="politica">Política de Tratamiento de Datos</a>.</div><label class="acepto"><input type="checkbox" id="ok" '+(S.acepto?'checked':'')+'><span>He leído y acepto el contrato, los Términos y Condiciones y la Política de Tratamiento de Datos.</span></label>';
 }else h+='<p class="cont" style="margin-top:14px">Lea todas las páginas para poder aceptar y pagar.</p>';
 h+='<div class="err" id="err">'+esc(S.err)+'</div><div class="fila"><button class="btn gris" id="atr">Cambiar datos</button><button class="btn oro" id="pagar" '+(fin&&S.acepto&&!S.ocupado?'':'disabled')+'>'+(S.ocupado?'Abriendo el pago…':'Ir a pagar')+'</button></div></div>';
 $('vista').innerHTML=h;
 $('atr').onclick=function(){S.paso=2;render()};
 $('ant').onclick=function(){S.pag--;vContrato()};
 $('sg').onclick=function(){S.pag++;S.ultimaVista=Math.max(S.ultimaVista,S.pag);vContrato()};
 if($('ok'))$('ok').onchange=function(){S.acepto=this.checked;$('pagar').disabled=!(S.acepto&&!S.ocupado)};
 document.querySelectorAll('[data-d]').forEach(function(a){a.onclick=function(e){e.preventDefault();vDoc(a.dataset.d)}});
 $('pagar').onclick=pagar
}
function vDoc(k){var d=S.docs.filter(function(x){return x.documento===k})[0];if(!d)return;
 $('vista').innerHTML='<div class="tarjeta"><h2>'+esc(d.titulo)+'</h2><div class="pag">'+(d.bloques||[]).map(bloqueHtml).join('')+'</div><div class="fila"><button class="btn" id="vol">Volver al contrato</button></div></div>';$('vol').onclick=vContrato}
function pagar(){
 S.ocupado=true;S.err='';vContrato();
 llamar(Object.assign({operacion:'iniciar',plan_id:S.plan.id,modalidad:S.modal,acepto:true},S.datos)).then(function(r){
  S.ref=r.referencia;return cargarBold().then(function(){
   var cfg={orderId:r.referencia,currency:r.moneda,amount:String(r.monto),apiKey:r.llave_identidad,integritySignature:r.firma_integridad,description:'DC Gestión Jurídica · plan '+S.plan.nombre+' ('+S.modal+')',redirectionUrl:location.origin+location.pathname+'?ref='+encodeURIComponent(r.referencia),customerData:JSON.stringify({email:S.datos.correo,fullName:S.datos.titular_nombre})};
   new window.BoldCheckout(cfg).open();S.ocupado=false;S.paso=4;vContrato()})
 }).catch(function(e){S.ocupado=false;S.err=e.message;vContrato()})
}
function cargarBold(){return new Promise(function(ok,mal){if(window.BoldCheckout)return ok();var s=document.createElement('script');s.src='https://checkout.bold.co/library/boldPaymentButton.js';s.onload=function(){window.BoldCheckout?ok():mal(new Error('No se pudo abrir la pasarela de pago.'))};s.onerror=function(){mal(new Error('No se pudo abrir la pasarela de pago. Revise su conexión.'))};document.head.appendChild(s)})}
function vEstado(ref){
 $('pasos').innerHTML='';var n=0;
 function pinta(t,m,ic){$('vista').innerHTML='<div class="tarjeta gran"><div class="ic">'+ic+'</div><h2>'+t+'</h2><p class="cont">'+m+'</p></div>'}
 pinta('Confirmando su pago…','Un momento, estamos esperando la confirmación del banco.','⏳');
 (function ciclo(){llamar({operacion:'estado',referencia:ref}).then(function(r){
  if(r.estado==='pagada')return pinta('¡Pago confirmado!','Su plan ya está activo. Le enviamos a su correo el contrato y el enlace para crear su contraseña. Si no lo ve, revise la carpeta de correo no deseado o escríbanos por WhatsApp al 312 783 7570.','✅');
  if(r.estado==='error')return pinta('No pudimos activar su cuenta','Escríbanos por WhatsApp al 312 783 7570 con la referencia '+esc(ref)+' y lo resolvemos de inmediato.','⚠️');
  if(++n>40)return pinta('Su pago sigue en revisión','Cuando el banco lo confirme, su acceso llegará al correo. Si tiene dudas, WhatsApp 312 783 7570 (referencia '+esc(ref)+').','🕒');
  setTimeout(ciclo,4000)}).catch(function(){setTimeout(ciclo,6000)})})()
}
function render(){pasos();({1:vPlan,2:vDatos,3:vContrato,4:vContrato})[S.paso]();window.scrollTo(0,0)}
var ref=new URLSearchParams(location.search).get('ref');
if(ref){vEstado(ref)}else llamar({operacion:'planes'}).then(function(r){
 S.planes=r.planes||[];S.docs=r.documentos||[];
 var q=new URLSearchParams(location.search).get('plan');if(q)S.plan=S.planes.filter(function(p){return String(p.nombre).toLowerCase()===q.toLowerCase()})[0]||null;
 if(!r.pagos_listos){$('vista').innerHTML='<div class="tarjeta gran"><div class="ic">🔧</div><h2>El pago en línea aún no está disponible</h2><p class="cont">Escríbanos por WhatsApp al 312 783 7570 y le ayudamos a contratar.</p></div>';pasos();return}
 render()
}).catch(function(e){$('vista').innerHTML='<div class="tarjeta">No se pudo cargar. '+esc(e.message)+'</div>'});
})();
</script></body></html>
